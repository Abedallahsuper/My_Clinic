name: Android Shopping App CI

on:
  push:
    # تم التغيير إلى master لأن مستودعك يستخدم هذا الاسم
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant permission for Gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # تم التحديث هنا إلى v4 لحل مشكلة الإيقاف من قبل GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopping-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
