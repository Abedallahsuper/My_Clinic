
  name: Android Shopping App CI

  on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main ]

  jobs:
    build:

      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup JDK 17
          uses: actions/setup-java@v3
          with:
            distribution: 'temurin'
            java-version: '17'

        - name: Grant permission
          run: chmod +x gradlew

        - name: Run Lint
          run: ./gradlew lint

        - name: Run Unit Tests
          run: ./gradlew test

        - name: Build APK
          run: ./gradlew assembleDebug